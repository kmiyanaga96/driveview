<style>
/* ============================================================
   DriveView - Stylesheet
   YouTube-inspired dark theme with premium aesthetics
   ============================================================ */

/* Fonts loaded via <link> in index.html for non-blocking rendering */

/* === Design Tokens === */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-surface: #1a1a28;
  --bg-surface-hover: #222236;
  --bg-overlay: rgba(0, 0, 0, 0.85);
  --accent: #6c5ce7;
  --accent-glow: rgba(108, 92, 231, 0.25);
  --accent-hover: #7d6ff0;
  --accent-red: #e94560;
  --text-primary: #eeeef2;
  --text-secondary: #8888a4;
  --text-muted: #555570;
  --border: rgba(255, 255, 255, 0.06);
  --border-hover: rgba(255, 255, 255, 0.12);
  --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.5);
  --shadow-modal: 0 12px 60px rgba(0, 0, 0, 0.8);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 4px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --font: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
}

/* === Reset === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: var(--font); cursor: pointer; border: none; outline: none; }
img { display: block; max-width: 100%; }

/* === Landing / Loading === */
#loading-overlay {
  position: fixed; inset: 0;
  background: var(--bg-primary);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999;
  transition: opacity 0.6s ease;
}
#loading-overlay.hidden { opacity: 0; pointer-events: none; }
.landing-logo {
  font-size: 42px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-red));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
  letter-spacing: -1px;
}
.landing-sub {
  font-size: 14px; color: var(--text-muted);
  margin-bottom: 32px;
  letter-spacing: 2px; text-transform: uppercase;
}
.loading-spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-text { margin-top: 16px; color: var(--text-secondary); font-size: 13px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Skeleton cards */
.skeleton-card {
  background: var(--bg-surface);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}
.skeleton-thumb {
  width: 100%; aspect-ratio: 16/9;
  background: var(--bg-secondary);
}
.skeleton-body { padding: 12px 14px; }
.skeleton-line {
  height: 12px; border-radius: 6px;
  background: var(--bg-secondary);
  margin-bottom: 8px;
}
.skeleton-line.short { width: 60%; }
.skeleton-line.long { width: 90%; }
@keyframes skeleton-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* === Header === */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10, 10, 15, 0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
}
.header-inner {
  max-width: 1600px; margin: 0 auto;
  display: flex; align-items: center; gap: 20px;
}
.logo {
  font-size: 20px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-red));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
  letter-spacing: -0.5px;
}

/* === Search === */
.search-container {
  flex: 1; max-width: 600px; position: relative;
}
.search-input {
  width: 100%; padding: 10px 16px 10px 42px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  color: var(--text-primary);
  font-size: 14px;
  transition: var(--transition);
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
  outline: none;
}
.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 16px; pointer-events: none;
}

/* === Tag Filter Bar === */
.tag-bar {
  padding: 8px 24px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; overflow-x: auto;
  -ms-overflow-style: none; scrollbar-width: none;
}
.tag-bar::-webkit-scrollbar { display: none; }
.tag-chip {
  padding: 6px 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-secondary);
  font-size: 13px; font-weight: 500;
  white-space: nowrap;
  transition: var(--transition);
  cursor: pointer;
}
.tag-chip:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.tag-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* === Content Type Tabs === */
.type-tabs {
  display: flex; gap: 4px;
}
.type-tab {
  padding: 8px 16px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px; font-weight: 500;
  border-radius: 20px;
  transition: var(--transition);
}
.type-tab:hover { background: var(--bg-surface); color: var(--text-primary); }
.type-tab.active {
  background: var(--accent);
  color: #fff;
}

/* === Grid Gallery === */
.gallery-container {
  max-width: 1600px; margin: 0 auto; padding: 24px;
}
.gallery-stats {
  margin-bottom: 16px; font-size: 13px; color: var(--text-muted);
}
.gallery-grid {
  display: grid;
  gap: 20px;
}
.gallery-grid[data-view-type="Video"] {
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}
.gallery-grid[data-view-type="Manga"] {
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}

.card {
  background: var(--bg-surface);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  animation: fadeInUp 0.4s ease backwards;
  will-change: transform;
}
.card:hover {
  border-color: var(--border-hover);
  box-shadow: var(--shadow-card);
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.card-thumb {
  position: relative; width: 100%;
  overflow: hidden;
  background: var(--bg-secondary);
}
/* Video cards: 16:9 landscape */
.card[data-type="Video"] .card-thumb { aspect-ratio: 16/9; }
.card[data-type="Video"] .card-thumb img { object-fit: cover; }
/* Manga cards: 3:4 portrait to show full cover */
.card[data-type="Manga"] .card-thumb { aspect-ratio: 3/4; }
.card[data-type="Manga"] .card-thumb img { object-fit: contain; }
.card-thumb img {
  width: 100%; height: 100%;
}
.card-body { padding: 12px 14px; }
.card-title {
  font-size: 14px; font-weight: 500;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px; line-height: 1.4;
}
.card-tags {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.card-tag {
  font-size: 10px; padding: 1px 6px;
  background: rgba(108, 92, 231, 0.12);
  color: var(--accent-hover);
  border-radius: 10px;
}
/* Tag overlay on card hover */
.card-tag-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
  display: flex; flex-wrap: wrap; align-content: flex-end;
  gap: 4px; padding: 10px;
  opacity: 0; transition: opacity 0.2s ease;
  pointer-events: none;
}
.card:hover .card-tag-overlay { opacity: 1; }
.card-tag-overlay .card-tag {
  font-size: 11px; padding: 2px 8px;
  background: rgba(108, 92, 231, 0.35);
  backdrop-filter: blur(4px);
  color: #ddd;
}

/* === Empty State === */
.empty-state {
  text-align: center; padding: 80px 20px;
  color: var(--text-muted);
}
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state-text { font-size: 16px; }

/* === Video Modal === */
.modal-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal-content {
  width: 90vw; max-width: 1100px;
  max-height: 95vh;
  display: flex; flex-direction: column;
  background: var(--bg-secondary);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-modal);
  transform: scale(0.95);
  transition: transform 0.3s ease;
}
.modal-overlay.active .modal-content { transform: scale(1); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close {
  width: 36px; height: 36px;
  background: var(--bg-surface);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  font-size: 18px;
  transition: var(--transition);
}
.modal-close:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.modal-iframe-wrap {
  position: relative; width: 100%;
  padding-bottom: 56.25%; /* 16:9 */
}
.modal-iframe-wrap iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%; border: none;
}

/* === Manga Reader === */
.manga-reader {
  position: fixed; inset: 0;
  background: var(--bg-primary);
  z-index: 300;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.manga-reader.active { opacity: 1; pointer-events: all; }

.manga-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  background: rgba(10, 10, 15, 0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 10; flex-shrink: 0;
}
.manga-topbar-left { display: flex; align-items: center; gap: 12px; }
.manga-back-btn {
  width: 36px; height: 36px;
  background: var(--bg-surface);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  font-size: 18px;
  transition: var(--transition);
}
.manga-back-btn:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.manga-reader-title { font-size: 15px; font-weight: 600; }
.manga-page-indicator { font-size: 13px; color: var(--text-secondary); }

.manga-topbar-right { display: flex; align-items: center; gap: 8px; }
.manga-btn {
  padding: 7px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13px; font-weight: 500;
  transition: var(--transition);
  display: flex; align-items: center; gap: 6px;
}
.manga-btn:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.manga-btn.accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.manga-btn.accent:hover { background: var(--accent-hover); }

/* Manga viewer area - single page swipe mode */
.manga-body {
  display: flex; flex: 1; overflow: hidden; position: relative;
}
.manga-pages-container {
  flex: 1; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: #000;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
.manga-pages-container img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  transition: opacity 0.2s ease;
}
/* PC: constrain image width for readability */
@media (min-width: 768px) {
  .manga-pages-container img { max-width: 700px; }
}
/* Tap zones (mobile) */
.manga-tap-zone {
  position: absolute; top: 0; bottom: 0; width: 35%;
  z-index: 5; cursor: pointer;
}
.manga-tap-zone.left { left: 0; }
.manga-tap-zone.right { right: 0; }
.manga-tap-zone:active { background: rgba(255,255,255,0.03); }
/* PC nav buttons */
.manga-nav-btn {
  display: none;
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%;
  color: var(--text-secondary);
  font-size: 22px; z-index: 8;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.manga-nav-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
.manga-nav-btn.prev { left: 16px; }
.manga-nav-btn.next { right: 16px; }
@media (min-width: 768px) {
  .manga-nav-btn { display: flex; }
}
.manga-page-number {
  position: absolute; bottom: 12px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7); padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px; color: var(--text-secondary);
  z-index: 6; pointer-events: none;
}

/* Chapter sidebar */
.chapter-sidebar {
  width: 280px; flex-shrink: 0;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s ease;
}
.chapter-sidebar.open { transform: translateX(0); }
.chapter-sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.chapter-sidebar-title { font-size: 14px; font-weight: 600; }
.chapter-list {
  flex: 1; overflow-y: auto; padding: 8px;
}
.chapter-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  margin-bottom: 4px;
}
.chapter-item:hover { background: var(--bg-surface); }
.chapter-item-info { flex: 1; }
.chapter-item-label { font-size: 13px; font-weight: 500; }
.chapter-item-page { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.chapter-delete-btn {
  width: 28px; height: 28px;
  background: transparent;
  border-radius: 50%;
  color: var(--text-muted);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: var(--transition);
}
.chapter-item:hover .chapter-delete-btn { opacity: 1; }
.chapter-delete-btn:hover { background: rgba(233, 69, 96, 0.15); color: var(--accent-red); }

.chapter-empty {
  padding: 24px 16px; text-align: center;
  color: var(--text-muted); font-size: 13px;
}

/* === Scrollbar === */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-surface-hover); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* === Responsive === */
@media (max-width: 768px) {
  .header-inner { padding: 0; gap: 12px; }
  .gallery-container { padding: 16px; }
  .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card-body { padding: 8px 10px; }
  .card-title { font-size: 13px; }
  .modal-content { width: 96vw; }
  .chapter-sidebar { width: 100%; position: absolute; right: 0; top: 0; bottom: 0; z-index: 10; }
  .type-tabs { display: none; }
}
@media (max-width: 480px) {
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .logo { font-size: 16px; }
  .search-input { font-size: 13px; padding: 8px 12px 8px 36px; }
}
/* === Tag Editor Modal === */
.tag-editor-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(8px);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.tag-editor-overlay.active { opacity: 1; pointer-events: all; }
.tag-editor-panel {
  width: 90vw; max-width: 480px;
  background: var(--bg-secondary);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-modal);
  transform: scale(0.95);
  transition: transform 0.3s ease;
}
.tag-editor-overlay.active .tag-editor-panel { transform: scale(1); }
.tag-editor-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.tag-editor-title { font-size: 15px; font-weight: 600; }
.tag-editor-body { padding: 16px 20px; }
.tag-editor-chips {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 12px; min-height: 32px;
}
.tag-editor-chip {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  background: var(--accent-glow);
  border: 1px solid rgba(108, 92, 231, 0.3);
  border-radius: 16px;
  font-size: 13px; color: var(--accent-hover);
  animation: fadeInUp 0.2s ease;
}
.tag-editor-chip-remove {
  width: 18px; height: 18px;
  background: transparent; border-radius: 50%;
  color: var(--accent-hover); font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.tag-editor-chip-remove:hover { background: rgba(233, 69, 96, 0.2); color: var(--accent-red); }
.tag-input-container { position: relative; }
.tag-input {
  width: 100%; padding: 10px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 14px;
  transition: var(--transition);
}
.tag-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
  outline: none;
}
.tag-input::placeholder { color: var(--text-muted); }
.tag-suggestions {
  position: absolute; left: 0; right: 0; top: 100%;
  margin-top: 4px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  max-height: 180px; overflow-y: auto;
  z-index: 10;
  display: none;
}
.tag-suggestions.visible { display: block; }
.tag-suggestion-item {
  padding: 8px 14px;
  font-size: 13px; color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}
.tag-suggestion-item:hover,
.tag-suggestion-item.highlighted {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}
.tag-suggestion-new {
  color: var(--accent);
  font-style: italic;
}
.tag-editor-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}
.tag-editor-btn {
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500;
  transition: var(--transition);
}
.tag-editor-btn.cancel {
  background: var(--bg-surface);
  color: var(--text-secondary);
}
.tag-editor-btn.cancel:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
.tag-editor-btn.save {
  background: var(--accent);
  color: #fff;
}
.tag-editor-btn.save:hover { background: var(--accent-hover); }

/* Card action buttons (Tag edit, Thumb edit) */
.card-action-btn {
  font-size: 11px; padding: 2px 8px;
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
  border-radius: 10px;
  cursor: pointer;
  transition: var(--transition);
  border: 1px dashed var(--border);
  display: inline-flex; align-items: center; gap: 4px;
}
.card-action-btn:hover {
  background: var(--accent-glow);
  color: var(--accent-hover);
  border-color: var(--accent);
}

/* === Thumbnail Editor === */
.thumb-editor-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(8px);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.thumb-editor-overlay.active { opacity: 1; pointer-events: all; }
.thumb-editor-panel {
  width: 90vw; max-width: 640px; max-height: 85vh;
  background: var(--bg-secondary);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-modal);
  display: flex; flex-direction: column;
  transform: scale(0.95);
  transition: transform 0.3s ease;
}
.thumb-editor-overlay.active .thumb-editor-panel { transform: scale(1); }
.thumb-editor-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.thumb-editor-title { font-size: 15px; font-weight: 600; }
.thumb-editor-body {
  padding: 16px 20px; overflow-y: auto; flex: 1;
}
.thumb-editor-section-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
