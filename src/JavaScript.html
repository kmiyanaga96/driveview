<script>
/* ============================================================
   DriveView - Frontend SPA Logic
   ============================================================ */

// === State ===
var appState = {
  allContent: [],
  filteredContent: [],
  allTags: [],
  selectedTags: [],
  selectedType: 'Video',
  searchQuery: '',
  currentView: 'gallery',
  currentItem: null,
  mangaPages: [],
  mangaChapters: [],
  currentPageIndex: 0,
  loadedPageCount: 0,
  chapterSidebarOpen: false,
  BATCH_SIZE: 10,
  // Tag editor
  tagEditorTarget: null,
  tagEditorTags: [],
  tagSuggestionIndex: -1,
  // Thumb editor
  thumbEditorTarget: null,
  thumbEditorSelected: '',
  // SWR: 楽観更新が走った後はサーバの古い応答で上書きしない
  hasLocalMutations: false
};

// === Tag Kinds ===
// タグは "種別:名前" の文字列で保存する（例: "作者:山田"）。ここに無い種別名や
// 接頭辞の無いタグは「その他」として扱う。種別を増やす場合はここに追記する。
var TAG_KINDS = {
  Video: ['作者', 'キャラ'],
  Manga: ['作者', '登場キャラ', 'シチュエーション']
};
var TAG_KIND_OTHER = 'その他';

// "種別:名前" を分解する。kindIdx は 0 = その他、1.. = TAG_KINDS の順
function parseTag(raw, type) {
  var i = raw.indexOf(':');
  if (i > 0) {
    var kinds = TAG_KINDS[type] || [];
    var k = kinds.indexOf(raw.slice(0, i).trim());
    if (k !== -1) {
      return { raw: raw, kind: kinds[k], name: raw.slice(i + 1).trim(), kindIdx: k + 1 };
    }
  }
  return { raw: raw, kind: '', name: raw, kindIdx: 0 };
}

function buildTag(kind, name) {
  return kind ? kind + ':' + name : name;
}

// 全角コロン・全角英数を正規化して前後の空白を除く
function normalizeTagInput(str) {
  return String(str || '').normalize('NFKC').trim();
}

// 種別順（その他は最後）→ 名前順
function compareTags(a, b) {
  var ka = a.kindIdx || Infinity;
  var kb = b.kindIdx || Infinity;
  return (ka === kb ? 0 : ka < kb ? -1 : 1) || a.name.localeCompare(b.name, 'ja');
}

// 検索用の正規化（全角半角・大文字小文字を無視）
function normalizeForSearch(str) {
  return String(str || '').normalize('NFKC').toLowerCase();
}

// タグのパースと検索用テキストを事前計算してアイテムに保持する
function indexItem(item) {
  var raws = item.tags
    ? item.tags.split(',').map(function (t) { return t.trim(); }).filter(Boolean)
    : [];
  item._parsedTags = raws;
  var tags = raws.map(function (r) { return parseTag(r, item.type); }).sort(compareTags);
  item._tagInfo = tags;
  var text = item.title || '';
  for (var i = 0; i < tags.length; i++) text += '\n' + tags[i].raw;
  item._searchText = normalizeForSearch(text);
}

function renderCardTags(item) {
  var html = '';
  var tags = item._tagInfo || [];
  for (var i = 0; i < tags.length; i++) {
    var t = tags[i];
    html += '<span class="card-tag kind-' + t.kindIdx + '"' +
      (t.kind ? ' title="' + escapeHtml(t.kind) + '"' : '') + '>' +
      escapeHtml(t.name) + '</span>';
  }
  return html;
}

// === Init ===
document.addEventListener('DOMContentLoaded', function () {
  bindEvents();
  showSkeletonCards();
  clearLegacySessionCache_();

  // Stale-While-Revalidate: 端末のキャッシュがあれば即座に描画し、
  // その版数をサーバへ送って差分がある場合のみ本体を受け取る
  ContentCache.read(function (entry) {
    var version = null;
    if (entry && entry.items && entry.items.length) {
      version = entry.version || null;
      onContentLoaded(entry.items, /* fromCache */ true);
    }
    loadAllContent(version);
  });
});

// ============================================================
// Content Cache (IndexedDB)
// sessionStorage (約5MB) は Base64 サムネイルで容量超過しやすいため IndexedDB を使う。
// 利用できない環境では何もしない (常にサーバから取得)。
// ============================================================

var ContentCache = (function () {
  var DB_NAME = 'driveview';
  var STORE = 'cache';
  var KEY = 'content';
  var dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }

  function tx(mode, fn) {
    return open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(STORE, mode);
        var result = fn(t.objectStore(STORE));
        t.oncomplete = function () { resolve(result && result.result); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error); };
      });
    });
  }

  return {
    // callback(entry|null)  entry = { version, items }
    read: function (callback) {
      tx('readonly', function (store) { return store.get(KEY); })
        .then(function (entry) { callback(entry || null); })
        .catch(function () { callback(null); });
    },
    write: function (version, items) {
      var plain = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        plain.push({
          targetId: it.targetId, type: it.type, title: it.title, tags: it.tags,
          thumbnailUrl: it.thumbnailUrl, webViewUrl: it.webViewUrl
        });
      }
      tx('readwrite', function (store) {
        store.put({ version: version, items: plain }, KEY);
      }).catch(function () { /* キャッシュは諦める */ });
    }
  };
})();

// 旧実装 (sessionStorage) のキャッシュを削除して容量を空ける
function clearLegacySessionCache_() {
  try {
    sessionStorage.removeItem('driveview_content_v1');
    sessionStorage.removeItem('driveview_content_fp_v1');
  } catch (e) { /* ignore */ }
}

function showSkeletonCards() {
  var grid = document.getElementById('gallery-grid');
  var html = '';
  for (var i = 0; i < 8; i++) {
    html +=
      '<div class="skeleton-card">' +
        '<div class="skeleton-thumb"></div>' +
        '<div class="skeleton-body">' +
          '<div class="skeleton-line long"></div>' +
          '<div class="skeleton-line short"></div>' +
        '</div>' +
      '</div>';
  }
  grid.innerHTML = html;
}

// ============================================================
// API Wrappers (google.script.run)
// ============================================================

function loadAllContent(cachedVersion) {
  google.script.run
    .withSuccessHandler(onContentResponse)
    .withFailureHandler(onError)
    .getAllContent(cachedVersion);
}

function loadMangaReaderData(folderId, callback) {
  google.script.run
    .withSuccessHandler(callback)
    .withFailureHandler(onError)
    .getMangaReaderData(folderId);
}

function saveChapter(targetId, position, label, callback) {
  google.script.run
    .withSuccessHandler(callback)
    .withFailureHandler(onError)
    .addChapter(targetId, position, label);
}

function removeChapter(chapterId, callback) {
  google.script.run
    .withSuccessHandler(callback)
    .withFailureHandler(onError)
    .deleteChapter(chapterId);
}

function onError(err) {
  console.error('API Error:', err);
  alert('エラーが発生しました: ' + (err.message || err));
}

function saveTags(targetId, tagsStr, callback) {
  google.script.run
    .withSuccessHandler(callback)
    .withFailureHandler(onError)
    .updateTags(targetId, tagsStr);
}

// ============================================================
// Data Loading
// ============================================================

function onContentResponse(res) {
  res = res || {};

  // キャッシュが最新: 既に描画済みなので何もしない
  if (res.notModified) {
    hideLoading();
    return;
  }

  // 楽観更新済み → サーバの古い状態で上書きしない（次回ロードで反映される）
  if (appState.hasLocalMutations) {
    hideLoading();
    return;
  }

  var items = res.items || [];
  onContentLoaded(items, false);
  ContentCache.write(res.version, items);
}

function onContentLoaded(data, fromCache) {
  data = data || [];
  appState.allContent = data;

  // タグと検索用テキストを一度だけ計算しキャッシュ
  for (var i = 0; i < data.length; i++) indexItem(data[i]);

  extractTags();
  renderTagBar();
  applyFilters();
  hideLoading();
}

function extractTags() {
  var tagCount = {};
  var type = appState.selectedType;
  var src = appState.allContent;
  for (var i = 0; i < src.length; i++) {
    var item = src[i];
    if (item.type !== type) continue;
    var parsed = item._parsedTags;
    if (!parsed || !parsed.length) continue;
    for (var j = 0; j < parsed.length; j++) {
      var tag = parsed[j];
      tagCount[tag] = (tagCount[tag] || 0) + 1;
    }
  }
  appState.allTags = Object.keys(tagCount).sort(function (a, b) {
    return tagCount[b] - tagCount[a];
  });
}

// ============================================================
// Search & Filter (Client-side, zero latency)
// ============================================================

function applyFilters() {
  // 空白区切りの各語がタイトルかタグのいずれかに含まれるもの (AND)
  var terms = normalizeForSearch(appState.searchQuery).split(/\s+/).filter(Boolean);
  var tags = appState.selectedTags;
  var hasTagFilter = tags.length > 0;
  var type = appState.selectedType;
  var typeAll = type === 'All';

  var filtered = [];
  var src = appState.allContent;
  for (var i = 0; i < src.length; i++) {
    var item = src[i];
    if (!typeAll && item.type !== type) continue;
    if (terms.length) {
      var text = item._searchText || '';
      var hit = true;
      for (var q = 0; q < terms.length; q++) {
        if (text.indexOf(terms[q]) === -1) { hit = false; break; }
      }
      if (!hit) continue;
    }
    if (hasTagFilter) {
      var itemTags = item._parsedTags || [];
      var ok = true;
      for (var j = 0; j < tags.length; j++) {
        if (itemTags.indexOf(tags[j]) === -1) { ok = false; break; }
      }
      if (!ok) continue;
    }
    filtered.push(item);
  }
  appState.filteredContent = filtered;
  renderGallery();
}

// ============================================================
// Event Binding
// ============================================================

function bindEvents() {
  setupGalleryDelegation();
  setupTagBarDelegation();

  // Search input (短めの debounce で体感を維持)
  var searchInput = document.getElementById('search-input');
  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    appState.searchQuery = this.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { applyFilters(); }, 100);
  });

  // Type tabs
  document.querySelectorAll('.type-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.type-tab').forEach(function (t) { t.classList.remove('active'); });
      this.classList.add('active');
      appState.selectedType = this.dataset.type;
      
      // Reset selected tag filters when switching tabs to avoid zero results
      appState.selectedTags = [];
      
      // Re-extract tags and re-render the tag bar for the new type
      extractTags();
      renderTagBar();
      
      applyFilters();
    });
  });

  // Video modal close
  document.getElementById('video-modal').addEventListener('click', function (e) {
    if (e.target === this) closeVideoModal();
  });
  document.getElementById('modal-close-btn').addEventListener('click', closeVideoModal);

  // Manga reader close
  document.getElementById('manga-back-btn').addEventListener('click', closeMangaReader);

  // Chapter toggle
  document.getElementById('chapter-toggle-btn').addEventListener('click', toggleChapterSidebar);

  // Chapter add
  document.getElementById('chapter-add-btn').addEventListener('click', addCurrentChapter);

  // Tag editor
  document.getElementById('tag-editor').addEventListener('click', function (e) {
    if (e.target === this) closeTagEditor();
  });
  document.getElementById('tag-editor-close').addEventListener('click', closeTagEditor);
  document.getElementById('tag-editor-cancel').addEventListener('click', closeTagEditor);
  document.getElementById('tag-editor-save').addEventListener('click', saveTagEditor);

  var tagInput = document.getElementById('tag-input');
  var tagInputTimer = null;
  tagInput.addEventListener('input', function () {
    clearTimeout(tagInputTimer);
    tagInputTimer = setTimeout(onTagInput, 60);
  });
  tagInput.addEventListener('keydown', onTagInputKeydown);
  tagInput.addEventListener('focus', function () { onTagInput(); });
  tagInput.addEventListener('blur', function () {
    setTimeout(function () { hideSuggestions(); }, 200);
  });

  // 種別選択（委譲）
  document.getElementById('tag-kind-select').addEventListener('click', function (e) {
    var btn = e.target.closest('.tag-kind-btn');
    if (!btn) return;
    appState.tagEditorKind = btn.dataset.kind;
    renderTagKindSelect();
    onTagInput();
    tagInput.focus();
  });

  // Thumb editor
  document.getElementById('thumb-editor').addEventListener('click', function (e) {
    if (e.target === this) closeThumbEditor();
  });
  document.getElementById('thumb-editor-close').addEventListener('click', closeThumbEditor);
  document.getElementById('thumb-editor-cancel').addEventListener('click', closeThumbEditor);
  document.getElementById('thumb-editor-save').addEventListener('click', saveThumbEditor);

  // Keyboard
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (document.getElementById('thumb-editor').classList.contains('active')) closeThumbEditor();
      else if (document.getElementById('tag-editor').classList.contains('active')) closeTagEditor();
      else if (appState.currentView === 'manga') closeMangaReader();
      else if (appState.currentView === 'video') closeVideoModal();
    }
  });
}

// ============================================================
// Rendering - Gallery
// ============================================================

var TITLE_EXT_RE = /\.(mp4|mkv|avi|mov|webm|zip|rar|7z|pdf)$/i;

function renderGallery() {
  var grid = document.getElementById('gallery-grid');
  var stats = document.getElementById('gallery-stats');

  grid.dataset.viewType = appState.selectedType;
  stats.textContent = appState.filteredContent.length + ' 件のコンテンツ';

  if (appState.filteredContent.length === 0) {
    grid.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📂</div>' +
        '<div class="empty-state-text">コンテンツが見つかりません</div>' +
      '</div>';
    return;
  }

  // 文字列連結のみで一括 innerHTML。リスナーは委譲で一括処理。
  var parts = [];
  var items = appState.filteredContent;
  for (var idx = 0; idx < items.length; idx++) {
    var item = items[idx];
    var tagHtml = renderCardTags(item);

    var displayTitle = item.title ? item.title.replace(TITLE_EXT_RE, '') : '';
    var delay = idx < 10 ? (idx * 0.03).toFixed(2) : '0.30';
    var targetEsc = escapeHtml(item.targetId);

    parts.push(
      '<div class="card" data-index="' + idx + '" data-target="' + targetEsc + '" data-type="' + item.type + '" style="animation-delay:' + delay + 's">' +
        '<div class="card-thumb">' +
          '<img src="' + escapeHtml(item.thumbnailUrl || '') + '" alt="" loading="lazy" decoding="async" onerror="this.style.display=\'none\'">' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">' + escapeHtml(displayTitle) + '</div>' +
          '<div class="card-tags">' + tagHtml + '</div>' +
          '<div class="card-actions">' +
            '<span class="card-action-btn tag-edit-btn">✏️ タグ</span>' +
            '<span class="card-action-btn thumb-edit-btn">🖼️ サムネ</span>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  grid.innerHTML = parts.join('');
}

// gallery-grid 用のイベント委譲（1度だけバインド）
function setupGalleryDelegation() {
  var grid = document.getElementById('gallery-grid');
  grid.addEventListener('click', function (e) {
    var target = e.target;

    if (target.closest('.tag-edit-btn')) {
      e.stopPropagation();
      var card = target.closest('.card');
      if (card) openTagEditor(card.dataset.target);
      return;
    }

    if (target.closest('.thumb-edit-btn')) {
      e.stopPropagation();
      var card2 = target.closest('.card');
      if (card2) openThumbEditor(card2.dataset.target);
      return;
    }

    if (target.closest('.card-thumb') || target.closest('.card-title')) {
      var card3 = target.closest('.card');
      if (!card3) return;
      var idx = parseInt(card3.dataset.index, 10);
      var item = appState.filteredContent[idx];
      if (!item) return;
      if (item.type === 'Video') openVideoModal(item);
      else if (item.type === 'Manga') openMangaReader(item);
    }
  });
}

// 種別ごとにグループ化して表示（グループ内は使用数の多い順）
function renderTagBar() {
  var bar = document.getElementById('tag-bar');
  var type = appState.selectedType;
  var kinds = TAG_KINDS[type] || [];
  var groups = [];
  for (var g = 0; g <= kinds.length; g++) groups.push([]);
  for (var i = 0; i < appState.allTags.length; i++) {
    var t = parseTag(appState.allTags[i], type);
    groups[t.kindIdx].push(t);
  }

  var parts = [];
  var selected = appState.selectedTags;
  var order = [];
  for (var k = 1; k <= kinds.length; k++) order.push(k);
  order.push(0); // その他は最後
  for (var o = 0; o < order.length; o++) {
    var idx = order[o];
    var list = groups[idx];
    if (!list.length) continue;
    parts.push('<span class="tag-group-label kind-' + idx + '">' +
      escapeHtml(idx ? kinds[idx - 1] : TAG_KIND_OTHER) + '</span>');
    for (var j = 0; j < list.length; j++) {
      var tag = list[j];
      var active = selected.indexOf(tag.raw) !== -1 ? ' active' : '';
      parts.push('<button class="tag-chip kind-' + idx + active + '" data-tag="' +
        escapeHtml(tag.raw) + '">' + escapeHtml(tag.name) + '</button>');
    }
  }
  bar.innerHTML = parts.join('');
}

function setupTagBarDelegation() {
  var bar = document.getElementById('tag-bar');
  bar.addEventListener('click', function (e) {
    var chip = e.target.closest('.tag-chip');
    if (!chip) return;
    var tag = chip.dataset.tag;
    var idx = appState.selectedTags.indexOf(tag);
    if (idx === -1) appState.selectedTags.push(tag);
    else appState.selectedTags.splice(idx, 1);
    chip.classList.toggle('active');
    applyFilters();
  });
}

// ============================================================
// Video Modal
// ============================================================

function openVideoModal(item) {
  appState.currentView = 'video';
  appState.currentItem = item;

  document.getElementById('modal-title').textContent = item.title;

  var iframe = document.getElementById('video-iframe');
  // webViewLink を preview 用に変換
  iframe.src = item.webViewUrl ? item.webViewUrl.replace(/\/view.*/, '/preview') : '';

  document.getElementById('video-modal').classList.add('active');
}

function closeVideoModal() {
  appState.currentView = 'gallery';
  document.getElementById('video-modal').classList.remove('active');
  document.getElementById('video-iframe').src = '';
}

// ============================================================
// Manga Reader
// ============================================================

function openMangaReader(item) {
  appState.currentView = 'manga';
  appState.currentItem = item;
  appState.mangaPages = [];
  appState.currentPageIndex = 0;
  appState.chapterSidebarOpen = false;

  var displayTitle = item.title.replace(/\.(mp4|mkv|avi|mov|webm|zip|rar|7z|pdf)$/i, '');
  document.getElementById('manga-reader-title').textContent = displayTitle;
  document.getElementById('manga-page-indicator').textContent = '読み込み中...';
  // リーダーの DOM は永続化（再ビルドや多重リスナーを避ける）。
  // ロード中はページ番号インジケーターのみで表現する。
  ensureMangaReaderDom_();
  var img = document.getElementById('manga-pages').querySelector('.manga-page-img');
  if (img) img.removeAttribute('src');
  document.getElementById('chapter-list').innerHTML = '';
  document.getElementById('chapter-sidebar').classList.remove('open');

  document.getElementById('manga-reader').classList.add('active');

  loadMangaReaderData(item.targetId, function (data) {
    data = data || {};
    appState.mangaPages = data.pages || [];
    appState.mangaChapters = data.chapters || [];
    renderCurrentPage();
    setupMangaNavigation();
    renderChapterList();
  });
}

function closeMangaReader() {
  appState.currentView = 'gallery';
  document.getElementById('manga-reader').classList.remove('active');
  appState.mangaPages = [];
  appState.mangaChapters = [];
  removeMangaNavigation();
}

// 一度だけ生成し、ページ送りでは img.src と番号テキストのみ更新する
function ensureMangaReaderDom_() {
  var container = document.getElementById('manga-pages');
  if (container._built) return container;

  container.innerHTML =
    '<img class="manga-page-img" alt="" fetchpriority="high" decoding="async">' +
    '<div class="manga-tap-zone left"></div>' +
    '<div class="manga-tap-zone right"></div>' +
    '<button class="manga-nav-btn prev">❮</button>' +
    '<button class="manga-nav-btn next">❯</button>' +
    '<div class="manga-page-number"></div>';

  // 委譲: container 内の click 1つで left/right/prev/next を捌く
  container.addEventListener('click', function (e) {
    if (e.target.closest('.manga-tap-zone.left') || e.target.closest('.manga-nav-btn.prev')) {
      mangaPagePrev();
    } else if (e.target.closest('.manga-tap-zone.right') || e.target.closest('.manga-nav-btn.next')) {
      mangaPageNext();
    }
  });

  container._built = true;
  return container;
}

function renderCurrentPage() {
  var container = ensureMangaReaderDom_();
  var total = appState.mangaPages.length;
  var idx = appState.currentPageIndex;

  var emptyMsg = container.querySelector('.manga-empty');
  if (total === 0) {
    if (!emptyMsg) {
      var empty = document.createElement('div');
      empty.className = 'empty-state manga-empty';
      empty.innerHTML = '<div class="empty-state-icon">📖</div><div class="empty-state-text">ページが見つかりません</div>';
      container.appendChild(empty);
    }
    var imgEmpty = container.querySelector('.manga-page-img');
    if (imgEmpty) imgEmpty.removeAttribute('src');
    container.querySelector('.manga-page-number').textContent = '';
    return;
  }
  if (emptyMsg) emptyMsg.remove();

  var img = container.querySelector('.manga-page-img');
  var pageNum = container.querySelector('.manga-page-number');
  var page = appState.mangaPages[idx];

  img.src = page.url;
  img.alt = 'Page ' + (idx + 1);
  pageNum.textContent = (idx + 1) + ' / ' + total;

  // 前後 2 ページを先読み（ブラウザのキャッシュに乗せておく）
  for (var off = -2; off <= 2; off++) {
    if (off === 0) continue;
    var p = idx + off;
    if (p >= 0 && p < total) {
      var pre = new Image();
      pre.src = appState.mangaPages[p].url;
    }
  }

  updatePageIndicator();
}

function mangaPageNext() {
  if (appState.currentPageIndex < appState.mangaPages.length - 1) {
    appState.currentPageIndex++;
    renderCurrentPage();
  }
}

function mangaPagePrev() {
  if (appState.currentPageIndex > 0) {
    appState.currentPageIndex--;
    renderCurrentPage();
  }
}

function setupMangaNavigation() {
  // Keyboard navigation
  appState._mangaKeyHandler = function (e) {
    if (appState.currentView !== 'manga') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); mangaPageNext(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); mangaPagePrev(); }
  };
  document.addEventListener('keydown', appState._mangaKeyHandler);

  // Swipe navigation
  var container = document.getElementById('manga-pages');
  appState._swipeStartX = 0;
  appState._swipeStartY = 0;

  appState._touchStartHandler = function (e) {
    appState._swipeStartX = e.touches[0].clientX;
    appState._swipeStartY = e.touches[0].clientY;
  };
  appState._touchEndHandler = function (e) {
    var dx = e.changedTouches[0].clientX - appState._swipeStartX;
    var dy = e.changedTouches[0].clientY - appState._swipeStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) mangaPageNext();  // Swipe left = next
      else mangaPagePrev();          // Swipe right = prev
    }
  };

  container.addEventListener('touchstart', appState._touchStartHandler, { passive: true });
  container.addEventListener('touchend', appState._touchEndHandler, { passive: true });
}

function removeMangaNavigation() {
  if (appState._mangaKeyHandler) {
    document.removeEventListener('keydown', appState._mangaKeyHandler);
    appState._mangaKeyHandler = null;
  }
  var container = document.getElementById('manga-pages');
  if (container && appState._touchStartHandler) {
    container.removeEventListener('touchstart', appState._touchStartHandler);
    container.removeEventListener('touchend', appState._touchEndHandler);
  }
}

function updatePageIndicator() {
  var indicator = document.getElementById('manga-page-indicator');
  indicator.textContent = (appState.currentPageIndex + 1) + ' / ' + appState.mangaPages.length + ' ページ';
}

function jumpToPage(pageIndex) {
  if (pageIndex >= 0 && pageIndex < appState.mangaPages.length) {
    appState.currentPageIndex = pageIndex;
    renderCurrentPage();
  }
}

// Chapter Management

function toggleChapterSidebar() {
  appState.chapterSidebarOpen = !appState.chapterSidebarOpen;
  document.getElementById('chapter-sidebar').classList.toggle('open', appState.chapterSidebarOpen);
}

function addCurrentChapter() {
  var label = prompt('チャプター名を入力してください:');
  if (!label || !label.trim()) return;

  var targetId = appState.currentItem.targetId;
  var position = appState.currentPageIndex;
  var trimmed = label.trim();

  // Optimistic UI: 仮IDで先に描画し、サーバ確定で差し替える
  var tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  var optimistic = { chapterId: tempId, targetId: targetId, position: position, label: trimmed };
  appState.mangaChapters.push(optimistic);
  appState.mangaChapters.sort(function (a, b) { return a.position - b.position; });
  renderChapterList();
  if (!appState.chapterSidebarOpen) toggleChapterSidebar();

  saveChapter(targetId, position, trimmed, function (chapter) {
    var idx = appState.mangaChapters.findIndex(function (c) { return c.chapterId === tempId; });
    if (idx !== -1) {
      appState.mangaChapters[idx] = chapter;
      renderChapterList();
    }
  });
}

function renderChapterList() {
  var list = document.getElementById('chapter-list');

  if (appState.mangaChapters.length === 0) {
    list.innerHTML = '<div class="chapter-empty">チャプターが登録されていません</div>';
    return;
  }

  var parts = [];
  for (var i = 0; i < appState.mangaChapters.length; i++) {
    var ch = appState.mangaChapters[i];
    parts.push(
      '<div class="chapter-item" data-position="' + ch.position + '" data-id="' + escapeHtml(ch.chapterId) + '">' +
        '<div class="chapter-item-info">' +
          '<div class="chapter-item-label">' + escapeHtml(ch.label) + '</div>' +
          '<div class="chapter-item-page">' + (ch.position + 1) + ' ページ</div>' +
        '</div>' +
        '<button class="chapter-delete-btn" title="削除">✕</button>' +
      '</div>'
    );
  }
  list.innerHTML = parts.join('');

  // 委譲リスナーは初回のみセットアップ
  if (!list._delegated) {
    list._delegated = true;
    list.addEventListener('click', function (e) {
      var delBtn = e.target.closest('.chapter-delete-btn');
      if (delBtn) {
        e.stopPropagation();
        var item = delBtn.closest('.chapter-item');
        var chapterId = item.dataset.id;
        if (!confirm('このチャプターを削除しますか？')) return;

        // Optimistic UI: 即座にUIから削除
        appState.mangaChapters = appState.mangaChapters.filter(function (c) {
          return c.chapterId !== chapterId;
        });
        renderChapterList();

        removeChapter(chapterId, function () { /* background */ });
        return;
      }

      var row = e.target.closest('.chapter-item');
      if (row) {
        var pos = parseInt(row.dataset.position, 10);
        jumpToPage(pos);
      }
    });
  }
}

function openTagEditor(targetId) {
  var item = appState.allContent.find(function (c) { return c.targetId === targetId; });
  if (!item) return;

  appState.tagEditorTarget = item;
  appState.tagEditorTags = item.tags
    ? item.tags.split(',').map(function (t) { return t.trim(); }).filter(Boolean)
    : [];
  appState.tagSuggestionIndex = -1;
  appState.tagEditorKind = '';

  renderTagKindSelect();
  renderTagEditorChips();
  document.getElementById('tag-input').value = '';
  hideSuggestions();
  document.getElementById('tag-editor').classList.add('active');
  setTimeout(function () { document.getElementById('tag-input').focus(); }, 100);
}

function closeTagEditor() {
  document.getElementById('tag-editor').classList.remove('active');
  appState.tagEditorTarget = null;
  appState.tagEditorTags = [];
  hideSuggestions();
}

function saveTagEditor() {
  if (!appState.tagEditorTarget) return;

  var targetId = appState.tagEditorTarget.targetId;
  var type = appState.tagEditorTarget.type;
  var sortedTags = appState.tagEditorTags
    .map(function (r) { return parseTag(r, type); })
    .sort(compareTags)
    .map(function (t) { return t.raw; });
  var tagsStr = sortedTags.join(', ');

  // Optimistic Update
  var item = appState.allContent.find(function (c) { return c.targetId === targetId; });
  if (item) {
    item.tags = tagsStr;
    indexItem(item);
  }

  extractTags();
  renderTagBar();

  // 該当カードのみ差分更新
  var cardEl = document.querySelector('.card[data-target="' + cssEscape(targetId) + '"]');
  if (cardEl) {
    var tagsContainer = cardEl.querySelector('.card-tags');
    if (tagsContainer && item) tagsContainer.innerHTML = renderCardTags(item);
  }

  closeTagEditor();
  invalidateContentCache();

  saveTags(targetId, tagsStr, function () { /* background */ });
}

// 新規タグに付ける種別の選択ボタン
function renderTagKindSelect() {
  var container = document.getElementById('tag-kind-select');
  var kinds = TAG_KINDS[appState.tagEditorTarget.type] || [];
  var html = '';
  var all = [''].concat(kinds);
  for (var i = 0; i < all.length; i++) {
    var k = all[i];
    var idx = k ? i : 0;
    var active = appState.tagEditorKind === k ? ' active' : '';
    html += '<button class="tag-kind-btn kind-' + idx + active + '" data-kind="' + escapeHtml(k) + '">' +
      escapeHtml(k || TAG_KIND_OTHER) + '</button>';
  }
  container.innerHTML = html;
}

function renderTagEditorChips() {
  var container = document.getElementById('tag-editor-chips');
  var type = appState.tagEditorTarget ? appState.tagEditorTarget.type : '';
  var html = '';
  appState.tagEditorTags.forEach(function (tag, idx) {
    var t = parseTag(tag, type);
    html +=
      '<span class="tag-editor-chip kind-' + t.kindIdx + '">' +
        (t.kind ? '<span class="tag-kind-badge">' + escapeHtml(t.kind) + '</span>' : '') +
        escapeHtml(t.name) +
        '<button class="tag-editor-chip-remove" data-idx="' + idx + '">✕</button>' +
      '</span>';
  });
  container.innerHTML = html;

  container.querySelectorAll('.tag-editor-chip-remove').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idx = parseInt(this.dataset.idx);
      appState.tagEditorTags.splice(idx, 1);
      renderTagEditorChips();
    });
  });
}

// 入力値をタグ文字列にする。"種別:名前" で入力された場合はその種別、
// そうでなければ選択中の種別を付ける
function resolveTagInput(value) {
  var v = normalizeTagInput(value);
  if (!v) return '';
  var t = parseTag(v, appState.tagEditorTarget.type);
  if (t.kind) return t.name ? buildTag(t.kind, t.name) : '';
  return buildTag(appState.tagEditorKind, v);
}

function addTagToEditor(tag) {
  tag = normalizeTagInput(tag);
  if (!tag) return;
  // Prevent duplicates
  if (appState.tagEditorTags.indexOf(tag) !== -1) return;
  appState.tagEditorTags.push(tag);
  renderTagEditorChips();
  var input = document.getElementById('tag-input');
  input.value = '';
  // 続けて選べるよう、入力欄にフォーカスがあれば候補を出し直す
  if (document.activeElement === input) onTagInput();
  else hideSuggestions();
}

function onTagInput() {
  var input = document.getElementById('tag-input');
  var query = normalizeForSearch(input.value.trim());
  var suggestions = document.getElementById('tag-suggestions');
  var type = appState.tagEditorTarget ? appState.tagEditorTarget.type : '';
  appState.tagSuggestionIndex = -1;

  var matches;
  if (!query) {
    // 未入力: 既存タグを全件候補にしてスクロールで選べるようにする（Google 検索のサジェスト風）。
    // 種別ボタンで「その他」以外を選んでいればその種別に絞る。並びは種別順 → 使用数順
    var kindFilter = appState.tagEditorKind;
    matches = appState.allTags
      .filter(function (tag) { return appState.tagEditorTags.indexOf(tag) === -1; })
      .map(function (tag) { return parseTag(tag, type); })
      .filter(function (t) { return !kindFilter || t.kind === kindFilter; })
      .sort(function (a, b) { return (a.kindIdx || Infinity) - (b.kindIdx || Infinity) || 0; })
      .map(function (t) { return t.raw; });
  } else {
    // 入力あり: 名前・種別付き表記のどちらでも部分一致（種別は問わない）
    matches = appState.allTags.filter(function (tag) {
      return normalizeForSearch(tag).indexOf(query) !== -1 &&
             appState.tagEditorTags.indexOf(tag) === -1;
    });
  }

  var newTag = resolveTagInput(input.value);
  var exactExists = appState.allTags.indexOf(newTag) !== -1;
  var alreadyAdded = appState.tagEditorTags.indexOf(newTag) !== -1;

  var html = '';
  matches.forEach(function (tag, idx) {
    var t = parseTag(tag, type);
    html += '<div class="tag-suggestion-item" data-tag="' + escapeHtml(tag) + '" data-idx="' + idx + '">' +
      (t.kind ? '<span class="tag-kind-badge kind-' + t.kindIdx + '">' + escapeHtml(t.kind) + '</span>' : '') +
      escapeHtml(t.name) + '</div>';
  });

  // Offer to create new tag if not exact match
  if (newTag && !exactExists && !alreadyAdded) {
    var nt = parseTag(newTag, type);
    html += '<div class="tag-suggestion-item tag-suggestion-new" data-tag="' + escapeHtml(newTag) + '" data-idx="' + matches.length + '">' +
      '"' + escapeHtml(nt.name) + '" を' + escapeHtml(nt.kind || TAG_KIND_OTHER) + 'として新規作成</div>';
  }

  if (html) {
    suggestions.innerHTML = html;
    suggestions.classList.add('visible');

    suggestions.querySelectorAll('.tag-suggestion-item').forEach(function (item) {
      item.addEventListener('mousedown', function (e) {
        e.preventDefault();
        addTagToEditor(this.dataset.tag);
      });
    });
  } else {
    hideSuggestions();
  }
}

function onTagInputKeydown(e) {
  var suggestions = document.getElementById('tag-suggestions');
  var items = suggestions.querySelectorAll('.tag-suggestion-item');

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    appState.tagSuggestionIndex = Math.min(appState.tagSuggestionIndex + 1, items.length - 1);
    highlightSuggestion(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    appState.tagSuggestionIndex = Math.max(appState.tagSuggestionIndex - 1, -1);
    highlightSuggestion(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (appState.tagSuggestionIndex >= 0 && items[appState.tagSuggestionIndex]) {
      addTagToEditor(items[appState.tagSuggestionIndex].dataset.tag);
    } else if (e.target.value.trim()) {
      addTagToEditor(resolveTagInput(e.target.value));
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    if (items.length > 0) {
      var targetItem = appState.tagSuggestionIndex >= 0 ? items[appState.tagSuggestionIndex] : items[0];
      
      // Auto-complete if it's an existing tag (skip "Create new" unless explicitly highlighted)
      if (!targetItem.classList.contains('tag-suggestion-new') || appState.tagSuggestionIndex >= 0) {
        e.target.value = targetItem.dataset.tag;
        onTagInput(); // Refresh suggestions based on the newly completed word
      }
    }
  }
}

function highlightSuggestion(items) {
  items.forEach(function (item, idx) {
    item.classList.toggle('highlighted', idx === appState.tagSuggestionIndex);
  });
}

function hideSuggestions() {
  document.getElementById('tag-suggestions').classList.remove('visible');
  appState.tagSuggestionIndex = -1;
}

// ============================================================
// Video Frame Capture
// ============================================================

// 先頭だけ取得して素早くフレームを出す。動画の長さに対して取得済みの割合の範囲から切り出す。
var CAPTURE_HEAD_BYTES = 32 * 1024 * 1024;
var CAPTURE_SEEK_TIMEOUT_MS = 4000;

function setCaptureBusy_(busy) {
  var btn = document.getElementById('frame-capture-btn');
  var fullBtn = document.getElementById('frame-capture-full-btn');
  if (btn) btn.disabled = busy;
  if (fullBtn) fullBtn.disabled = busy;
  if (busy && btn) btn.textContent = '⏳ 動画を読み込み中...';
}

function showCaptureError_(status, message) {
  status.textContent = message;
  setCaptureBusy_(false);
  var btn = document.getElementById('frame-capture-btn');
  if (btn) btn.textContent = '🎬 再試行';
}

/**
 * @param {string} fileId
 * @param {boolean} full true なら動画全体を取得する
 */
function startFrameCapture(fileId, full) {
  var progress = document.getElementById('frame-capture-progress');
  var fill = document.getElementById('frame-capture-fill');
  var status = document.getElementById('frame-capture-status');
  progress.style.display = 'block';
  setCaptureBusy_(true);

  // 取得済みのデータで足りるなら再ダウンロードしない（再キャプチャが即時になる）
  var cached = appState.captureSource;
  if (cached && cached.fileId === fileId && (cached.complete || !full)) {
    captureFramesFromSource(cached, fill, status);
    return;
  }

  status.textContent = 'アクセス情報を取得中...';
  fill.style.width = '5%';

  google.script.run
    .withSuccessHandler(function (info) {
      status.textContent = 'ダウンロード準備中...';
      fetchVideoSource(info, full, fill, status)
        .then(function (source) {
          appState.captureSource = source;
          captureFramesFromSource(source, fill, status);
        })
        .catch(function (err) {
          showCaptureError_(status, 'エラー: ' + err.message);
        });
    })
    .withFailureHandler(function (err) {
      showCaptureError_(status, 'エラー: ' + (err.message || err));
    })
    .getVideoAccessInfo(fileId);
}

/**
 * 動画データを取得する。full=false なら先頭 CAPTURE_HEAD_BYTES のみを Range で取得する。
 * @returns {Promise<{fileId: string, blob: Blob, complete: boolean, fraction: number}>}
 */
function fetchVideoSource(info, full, fill, status) {
  var base = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(info.fileId);
  var auth = { 'Authorization': 'Bearer ' + info.token };

  if (full) {
    return fetchWithProgress_(base + '?alt=media&supportsAllDrives=true', auth, fill, status)
      .then(function (r) {
        return { fileId: info.fileId, blob: r.blob, complete: true, fraction: 1 };
      });
  }

  var sizeReq = fetch(base + '?fields=size&supportsAllDrives=true', { headers: auth })
    .then(function (res) { return res.ok ? res.json() : {}; })
    .then(function (meta) { return parseInt(meta.size || '0', 10); })
    .catch(function () { return 0; });

  var headers = { 'Authorization': auth.Authorization, 'Range': 'bytes=0-' + (CAPTURE_HEAD_BYTES - 1) };
  var headReq = fetchWithProgress_(base + '?alt=media&supportsAllDrives=true', headers, fill, status);

  return Promise.all([sizeReq, headReq]).then(function (results) {
    var size = results[0];
    var r = results[1];
    // 200 = Range 非対応で全体が返った / サイズ以下 = 全体を取得済み
    var complete = r.status !== 206 || (size > 0 && r.blob.size >= size);
    var fraction = complete ? 1 : (size > 0 ? r.blob.size / size : 0);
    return { fileId: info.fileId, blob: r.blob, complete: complete, fraction: fraction };
  });
}

// ストリームで読みながら進捗バー (5%〜50%) を更新する
function fetchWithProgress_(url, headers, fill, status) {
  return fetch(url, { headers: headers }).then(function (response) {
    if (!response.ok) throw new Error('動画の取得に失敗 (' + response.status + ')');

    if (!response.body) {
      status.textContent = '動画をダウンロード中...';
      return response.blob().then(function (blob) { return { status: response.status, blob: blob }; });
    }

    var reader = response.body.getReader();
    var total = parseInt(response.headers.get('Content-Length') || '0', 10);
    var loaded = 0;
    var chunks = [];

    return new Promise(function (resolve, reject) {
      function read() {
        reader.read().then(function (result) {
          if (result.done) {
            resolve({ status: response.status, blob: new Blob(chunks) });
            return;
          }
          chunks.push(result.value);
          loaded += result.value.length;

          var mbLoaded = (loaded / (1024 * 1024)).toFixed(1);
          if (total > 0) {
            var percent = Math.round((loaded / total) * 100);
            var mbTotal = (total / (1024 * 1024)).toFixed(1);
            status.textContent = 'ダウンロード中: ' + mbLoaded + 'MB / ' + mbTotal + 'MB (' + percent + '%)';
            fill.style.width = (5 + (percent * 0.45)) + '%';
          } else {
            status.textContent = 'ダウンロード中: ' + mbLoaded + 'MB';
          }
          read();
        }).catch(reject);
      }
      read();
    });
  });
}

// 先頭だけでは再生できない動画 (moov が末尾の MP4 など) は全体取得にフォールバックする
function fallbackToFullCapture_(source, status) {
  appState.captureSource = null;
  status.textContent = 'この動画は先頭だけでは読めないため、全体をダウンロードします...';
  startFrameCapture(source.fileId, true);
}

function captureFramesFromSource(source, fill, status) {
  var blobUrl = URL.createObjectURL(source.blob);
  var video = document.createElement('video');
  video.muted = true;
  video.preload = 'auto';
  var started = false;

  video.addEventListener('error', function () {
    if (started) return; // シーク中のエラーはフレーム単位でスキップする
    URL.revokeObjectURL(blobUrl);
    if (!source.complete) {
      fallbackToFullCapture_(source, status);
    } else {
      showCaptureError_(status, 'この動画形式はフレームキャプチャに対応していません');
    }
  });

  video.addEventListener('loadedmetadata', function () {
    var duration = video.duration;
    if (!duration || !isFinite(duration)) {
      URL.revokeObjectURL(blobUrl);
      if (!source.complete) {
        fallbackToFullCapture_(source, status);
      } else {
        showCaptureError_(status, '動画の長さを取得できません');
      }
      return;
    }
    started = true;

    status.textContent = 'フレームを抽出中...';
    fill.style.width = '50%';

    // 取得済みの範囲 (ビットレート一定と仮定した概算) からランダムに10点選ぶ
    var hi = source.complete ? 0.95 : Math.min(0.95, source.fraction * 0.85);
    var lo = source.complete ? 0.05 : hi * 0.05;
    var timestamps = [];
    for (var i = 0; i < 10; i++) {
      timestamps.push(duration * (lo + Math.random() * (hi - lo)));
    }
    timestamps.sort(function (a, b) { return a - b; });

    captureFramesSequentially(video, timestamps, 0, [], fill, status, function (frames) {
      URL.revokeObjectURL(blobUrl);
      if (frames.length === 0 && !source.complete) {
        fallbackToFullCapture_(source, status);
        return;
      }
      fill.style.width = '100%';
      status.textContent = '完了！ ' + frames.length + ' フレームを抽出しました' +
        (source.complete ? '' : '（動画の冒頭から）');
      displayCapturedFrames(frames, source);
    });
  });

  video.src = blobUrl;
  video.load();
}

function captureFramesSequentially(video, timestamps, idx, frames, fill, status, done) {
  if (idx >= timestamps.length) {
    done(frames);
    return;
  }

  var progress = 50 + (idx / timestamps.length) * 50;
  fill.style.width = progress + '%';
  status.textContent = 'フレーム ' + (idx + 1) + ' / ' + timestamps.length + ' を抽出中...';

  var finished = false;
  function next() {
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    video.removeEventListener('seeked', onSeeked);
    captureFramesSequentially(video, timestamps, idx + 1, frames, fill, status, done);
  }
  // 取得範囲外へのシークなどで seeked が来ない場合はそのフレームを諦める
  var timer = setTimeout(next, CAPTURE_SEEK_TIMEOUT_MS);

  function onSeeked() {
    try {
      var canvas = document.createElement('canvas');
      var targetWidth = Math.min(video.videoWidth, 320); // Resize to 320px width for 10KB size limit
      canvas.width = targetWidth;
      canvas.height = Math.round(canvas.width * (video.videoHeight / video.videoWidth));
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      var quality = 0.6; // High quality target around 10KB
      var dataUrl = canvas.toDataURL('image/jpeg', quality);

      // Compress to fit around 10KB limit (approx 15000 characters)
      while (dataUrl.length > 15000 && quality > 0.1) {
        quality -= 0.05;
        dataUrl = canvas.toDataURL('image/jpeg', quality);
      }

      // Fallback to smaller width if still exceeding 10KB
      if (dataUrl.length > 15000) {
        targetWidth = 200;
        canvas.width = targetWidth;
        canvas.height = Math.round(canvas.width * (video.videoHeight / video.videoWidth));
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        dataUrl = canvas.toDataURL('image/jpeg', 0.4);
      }

      frames.push({ url: dataUrl, time: formatTime(timestamps[idx]) });
    } catch (e) {
      console.warn('Frame capture failed at ' + timestamps[idx] + ': ' + e.message);
    }
    next();
  }
  video.addEventListener('seeked', onSeeked);
  video.currentTime = timestamps[idx];
}

function formatTime(seconds) {
  var m = Math.floor(seconds / 60);
  var s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function displayCapturedFrames(frames, source) {
  var grid = document.getElementById('frame-capture-grid');
  if (!grid) return;
  setCaptureBusy_(false);
  var btn = document.getElementById('frame-capture-btn');
  if (btn) btn.textContent = '🎬 再キャプチャ（別の10フレーム）';
  var fullBtn = document.getElementById('frame-capture-full-btn');
  if (fullBtn) fullBtn.style.display = source.complete ? 'none' : '';
  if (frames.length === 0) return;

  var body = document.getElementById('thumb-editor-body');
  var html = '';
  frames.forEach(function (f) {
    html += '<div class="thumb-option" data-url="' + f.url + '">';
    html += '<img src="' + f.url + '">';
    html += '</div>';
  });
  grid.innerHTML = html;

  bindThumbOptionClicks(body);
}

function saveThumbEditor() {
  if (!appState.thumbEditorTarget || !appState.thumbEditorSelected) return;

  var targetId = appState.thumbEditorTarget.targetId;
  var url = appState.thumbEditorSelected;

  // Optimistic Update
  var item = appState.allContent.find(function (c) { return c.targetId === targetId; });
  if (item) item.thumbnailUrl = url;

  var cardEl = document.querySelector('.card[data-target="' + cssEscape(targetId) + '"]');
  if (cardEl) {
    var imgEl = cardEl.querySelector('.card-thumb img');
    if (imgEl) {
      imgEl.src = url;
      imgEl.style.display = '';
    }
  }

  closeThumbEditor();
  invalidateContentCache();

  google.script.run
    .withFailureHandler(onError)
    .updateThumbnail(targetId, url);
}

// ============================================================
// Utilities
// ============================================================

// Pure string replacement HTML escape
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// CSS セレクター用に属性値をエスケープ（querySelector に data-target を埋め込むため）
function cssEscape(str) {
  if (window.CSS && CSS.escape) return CSS.escape(str);
  return String(str).replace(/(["\\\]])/g, '\\$1');
}

// 楽観更新後に呼ぶ。手元の最新状態をキャッシュし（版数は不明なので次回は全件取得）、
// 本セッション内の以後のサーバ応答による上書きを抑止する
function invalidateContentCache() {
  appState.hasLocalMutations = true;
  ContentCache.write(null, appState.allContent);
}

function hideLoading() {
  var overlay = document.getElementById('loading-overlay');
  if (overlay) {
    overlay.classList.add('hidden');
    setTimeout(function () { overlay.remove(); }, 500);
  }
}
</script>
