# main への push で Apps Script プロジェクトへ反映し、Web アプリのデプロイを更新する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   Secret   CLASPRC_JSON      : `clasp login` で作られる ~/.clasprc.json の中身
#   Variable GAS_DEPLOYMENT_ID : 更新する Web アプリのデプロイ ID (未設定ならコード反映のみ)
name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON が未設定です。README の自動デプロイ手順を参照してください。"
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push code
        run: npx clasp push --force

      - name: Update web app deployment
        if: ${{ vars.GAS_DEPLOYMENT_ID != '' }}
        env:
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
        run: npx clasp update-deployment "$GAS_DEPLOYMENT_ID" --description "main@${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
